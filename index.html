		# .gtext[Quantization Function]
		- Differntiable bit depth (b) and exp bit (e) inside the quantization function.
		```py
		def quantize_weight(x,b=3.5,e=-3.5):
		x_scaled = x/torch.exp2(e)
		half = torch.exp2(b-1)
		x_clipped = torch.clip(x_scaled,-1*half,half-1)
		x_round = torch.round(x_clipped)
		x_scaled_back = torch.exp2(e) * x_round
		return x_scaled_back
		```
		.grtext[This `q()` looks very similar to any other Q8A. For an example int4 which is `clip(x/s, -2^2, 2^2 -1)`]
		]

		.lc[
		# .gtext[Quantization Function]
		- instead of using pseudo-quantization noise like in DiffQ which is expensive we use STE estimators.
		- the derivative of a rounding function is either 0 or not-defined.
		- Since `b` and `e` are inside the rounding function we need STE Rounding.
		- With STE estimator we can now perform quantization aware training.
		- There exists smaller level sets of bit depth for every precision given tolerance as a function of precision.
		]

		.rcb[
		```py
		class STERound(torch.autograd.Function):
		"""
		same gradient as parent node.
		Also called as pass through gradient.
		or Straight Through Estimator.
		"""
		@staticmethod
		def forward(ctx,x):
		return torch.round(x)

		@staticmethod
		def backward(ctx,upstream):
		"""
		local jacobian is 1.
		"""
		return upstream

		```

		### Penalizing Convolution
		.left[
		- Convolution is a highly parallelizable operation.
		- Convolution can be parallelized by launching multiple windows independently as needed. Each window’s computation
		and async-copy and write can be completed entirely within a single shared memory block, resulting in a parallel
		depth complexity of O(1).
		- Scheduling increases with spatial resolution (H,W) and input features (I)
		- This cost also happens to be equal to the storage cost of the kernels.
		]

		<figure style="text-align: center;">
			<img src="./scratchpad/presentation/size_conv.png" width="400">
			<figcaption>.grtext[Eq2: Layer Size Convolution]</figcaption>
		</figure>
		.left[
		- .grtext[Suppose H,W,I,O stands for spatial resolution (height and width) and the input and the output feature
		maps]
		- .grtext[Then a convolutional kernel of shape (O, I, k, k) performs O(I · H · W · k^2) operations (MACs).]

		]

		---

		.left[
		<!-- - A Depthwise or grouped convolution kernel does less work than an ungrouped convolution kernel. -->
		<!-- - Then a kernel of shape (O, I, k, k) performs O(I/G · H · W · k^2) operations (MACs). -->
		<!-- - .grtext[where G is number of groups. I=G is a special grouped convolution which is also called depthwise convolution kernels.] -->
		- since a depthwise convolution kernel weight is independent of input features we use it for expand features so that
		it is independent of embedding dimension and after tranposed convolution as depthwise convolution has higher

			</div>
			<figcaption>Eq3:Attention Calculation</figcaption>
		</figure>
		.left[
		#### Improvements from the choice of Similarity Function
		- Full Softmax Attention uses softmax to calculate attention score.
		- But Online Softmax is linear in Sequence Length. And requires accumulation across shared memory blocks to safely
		calculate `exp^(logit -logit.max)`.
		- Instead of normalized score , researchers use an approximation with a cheaper O(1) activation like `relu`
		]

		## Linear Attention

		<figure style="display: flex; flex-direction: column; align-items: center;">
			<div style="display: flex; gap: 10px;">

				<img src="./scratchpad/presentation/linearAttn.png" width="300">
			</div>
			<figcaption>Eq3: Attention Calculation</figcaption>
		</figure>
		.left[
		- ##### Improvements from Associativity
		- Q,K,V : R:N -> d
		- so `Q@K.T` makes it Quadratic on Spatial Resolution.
		- alternative is to perform `K.T @ V` which makes it quadratic on head dimension.
		- since head dimension is significantly smaller than spatial resolution we see sizeable improvement in throughput.

		]

		---
		class: center, top
		### Setup(Target Device and Throughput Measurement)
		.left[
		- we use NVIDIA 4070 as our inference device and for profiling throughput of modules.
		- Throughput measured at FP32 for a fixed batch size.
		- we also make efforts in incorporating fused kernels for both training and inference time.
		- Inference time :For Compute-bound kernels (linear attention) we modify an off the shelf implementation to
		encorporate our quantization approach.
		- Training Time: For memory bounded kernels (top-k and cross-entropy) we use off-the shelf implementation as
		distributed.
		]


		---
		class:center,top
		### Setup(Implementation)
		.left[
		- Implemented in PyTorch and Cutlass-dsl.
		- Optimization: AdamW (β₁=0.9, β₂=0.999, ϵ=1e−8, weight decay=0.01).
		- Learning rate: cosine decay from 1e−3 to 1e−5; compression coefficient γ ramps from 0.1 → 0.2 on separate
		schedule.
		- Initialized parameters to simulate 4-bit precision for stable quantization-aware training.
		- Trained up to 1000 epochs with early stopping (patience=50, min. delta=0.01).
		]

		### Evaluation Metrics
		.left[
		.btext[Task Specific]
		- **Classification Accuracy**: Top-1 (highest-confidence match) and Top-5 (ground truth in top 5 predictions);
		relevant for fine-grained classification.
		- **Segmentation Quality (mIoU)**: Mean IoU across classes; balances boundary accuracy and correct categorization.
		- **Optical Flow Accuracy (EPE)**: Average Euclidean distance between predicted and ground truth flow vectors; lower
		is better.
		]
		.left[
		.ptext[Throughput Specific]
		- **Theoretical Complexity (FLOPS)**: GFLOPS for a single forward pass; architecture-independent measure of
		computational demand.
		- **Practical Throughput (Images/sec)**: Measured on NVIDIA RTX 4070 Mobile; includes all data loading and
		processing overhead for realistic deployment performance.
		]

		.left[
		- Convolutional Kernels: gradual pruning after ~300 epochs, accelerating 500–750 epochs; ~4.5% reduction.
		- Transposed Convolutions (Upscaling): minimal pruning, 1.2% reduction; critical for reconstruction.
		- Attention Heads: stable until ~750 epochs, then sharp drop; ~21.9% reduction, most aggressive pruning.
		- Overall: attention and convolutional layers pruned substantially, upscalers minimally; preserves spatial
		resolution.
		]

		### Compression Trends (CUB200 1.98M Model)
		<figure style="text-align: center;">
			<img src="./scratchpad/presentation/bitdepth.png" width="800">
			<figcaption>.grtext[Fig15: Model Compression]</figcaption>
		</figure>
		.left[
		- Average Bit-Depth: starts ~4.3 bits, gradually decays to ~3.0 bits; smooth adaptation over training.
		- Heterogeneous Allocation: embedding layer retains highest precision (~5 bits), deeper layers lower (~2 bits),
		mid-layers moderate (~3–4 bits).
		- Early layers and embeddings sensitive to precision; deeper layers tolerate aggressive quantization.
		- Network converges to mixed-precision: high precision in feature extraction, aggressive compression in deeper
		processing layers.
		]

		class:center,middle
		#### Question 1. Can we develop a unified, self-compressing vision architecture that prunes and compresses model
		components based on their computational cost, rather than applying a uniform approach?


		.gtext[Yes, We mostly match accuracy against current state of the art and the compute modules both compress and
		prune by using depthwise complexity as the penalizing factor.]


		---
		class:center,middle
		#### Question 2. Does this selective compression strategy maintain or improve model performance on dense prediction
		tasks, such as fine-grained classification, semantic segmentation, and optical flow, compared to state-of-the-art
		non-compressed models?

		.gtext[Other than Optical Flow Problem, We either match or improve upon the evaluation metric.]



		---
		class:center,middle
		#### Question 3. How do the storage requirements and inference throughput of our self-compressing model compare to
		existing models like EfficientViT and DiffQ on a given hardware target?

		.gtext[Yes,The Models were intialized at roughly the same shape but with pruning and compression we save on model
		checkpoint size.]


		---
		class:center,middle

		different modules across model layers, thereby enabling better architectural design?

		class:center,middle
		### Limitations
		.left[
		- **Latency Optimization**: Observe no improvement in throughput during training , as we compile the graph only once
		(to combat against irreversible forgetting)
		- **No Large Model**: scaling study across Small, Base, Large models needed.
		- **Task Generality**: Validated on three tasks only; extending to object detection, video understanding, and more
		could prove broader applicability.
		]

		---
		class:center,middle
		### Future Studies
		.left[
		- Develop training framework with just-in-time graph recompilation to optimize evolving sparse architectures during
		training.
		- Investigate scalability across multiple model sizes (Small, Base, Large) to validate generalizability.
		- Co-design compression algorithms with a better target hardware for real-world deployment efficiency.
		- Extend the study to broader vision tasks: object detection, instance segmentation, video analysis.
		]

		---
		class:center,middle
		### Conclusion
		.left[
		- Developed a self-compressing vision tower that prunes and quantizes convolutions, transposed convolutions, and
		linear attention based on computational cost.
		- Achieves competitive accuracy with EfficientViT on classification, segmentation, and optical flow benchmarks.
		- Reduces storage and FLOPs while surpassing DiffQ in accuracy and throughput.
		- Cost-aware compression provides insights into module importance across layers.
		- Facilitates efficient, interpretable, and hardware-aware model design.
		]

	<!-- Remark config -->
	<script>
		var slideshow = remark.create({
			navigation: {scroll: true, touch: true, click: false},
			ratio: "16:9",
			slideNumberFormat: function (current, total) {
				return "[" + current + "/" + total + "]";
			},
			highlightLanguage: 'python',
			highlightStyle: "sunburst",
			highlightLines: true,
		});
	</script>

	<script>
		let direction = 'right'; // default direction

		document.addEventListener('keydown', function (e) {
			if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
				direction = 'right';
			} else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
				direction = 'left';
			}
		});

		// Touch input
		let touchStartX = 0;
		let touchEndX = 0;

		document.addEventListener('touchstart', function (e) {
			touchStartX = e.changedTouches[0].screenX;
		});

		document.addEventListener('touchend', function (e) {
			touchEndX = e.changedTouches[0].screenX;
			handleGesture();
		});

		function handleGesture() {
			const delta = touchEndX - touchStartX;
			if (Math.abs(delta) > 30) { // minimum swipe distance
				if (delta < 0) {
					direction = 'right'; // swipe left = next
				} else {
					direction = 'left';  // swipe right = previous
				}
			}
		}

		slideshow.on('afterShowSlide', function () {
			const slide = document.querySelector('.remark-visible');
			if (!slide) return;

			// Remove both to reset state
			slide.classList.remove('slide-to-next', 'slide-to-prev');

			// Force reflow to flush previous animation
			void slide.offsetWidth;

			// Add animation based on keypress direction
			slide.classList.add(direction === 'right' ? 'slide-to-prev' : 'slide-to-next');
		});
	</script>

	<script>
		var slideElements

		function getElementForSlide(slide) {
			slideElements = slideElements || document.querySelectorAll('.remark-slide')
			return slideElements[slide.getSlideIndex()]
		}

		slideshow.on('showSlide', function (slide) {
			Array.from(getElementForSlide(slide).querySelectorAll('video')).forEach(function (vid) {
				vid.loop = true
				vid.currentTime = 0
				vid.play()
			})
		})

		slideshow.on('hideSlide', function (slide) {
			Array.from(getElementForSlide(slide).querySelectorAll('video')).forEach(function (vid) {
				vid.pause()
			})
		})
	</script>


	<script>
		var slideElements;

		function getElementForSlide(slide) {
			slideElements = slideElements || document.querySelectorAll('.remark-slide');
			return slideElements[slide.getSlideIndex()];
		}

		slideshow.on('showSlide', function (slide) {
			const slideEl = getElementForSlide(slide);

			// video handling (optional)
			Array.from(slideEl.querySelectorAll('video')).forEach(function (vid) {
				vid.loop = false;
				vid.currentTime = 0;
				vid.play();
			});

			// mermaid re-init
			const mermaidBlocks = slideEl.querySelectorAll('.mermaid');
			mermaidBlocks.forEach(block => {
				// prevent re-rendering already rendered diagrams
				if (!block.classList.contains('rendered')) {
					// render this block only
					mermaid.init(undefined, block);
					block.classList.add('rendered'); // mark as rendered
				}
			});
		});
	</script>
