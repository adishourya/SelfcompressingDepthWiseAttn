.lc[
# Quantization Function
- Our scaling factor will be given by some exponent bit e.
```py
def quantize_weight(x,b=2,e=-8):
		x_scaled = x/torch.exp2(e)
		half = torch.exp2(b-1)
		x_clipped = torch.clip(x_scaled,-1*half,half-1)
		x_round = torch.round(x_clipped)
		x_scaled_back = torch.exp2(e) * x_round
		return x_scaled_back
```

.lc[
# Quantization Function
- the derivative of a rounding function is either 0 or not-defined.
- Since `b` and `e` are inside the rounding function we need STE Rounding.
- With STE estimator we can now perform quantization aware training.
]

.rcb[
```py
class STERound(torch.autograd.Function):
		"""
		same gradient as parent node. 
		Also called as pass through gradient.
		or Straight Through Estimator.
		"""
		@staticmethod
		def forward(ctx,x):
				return torch.round(x)

		@staticmethod
		def backward(ctx,upstream):
				"""
				local jacobian is 1.
				"""
				return upstream

```

# Training Objective
- we will penalize our model by the current size of the size of the model.
- the current size is given by the sum of the layer size of the targeted "quantized" modules.
- This also acts as a regularization term. (like the l1 loss which gets penalized by the sum of model's `abs(weights)`)

]

.rcb[
```py
with torch.autocast(device_type="cuda",
				dtype=self.amp_dtype):

		out = self.model(batch_img)
		# end of fwd pass
		# current size of model / init size of model
		bit_decay = self._qlayersize() / self.qtot_init
		# add penalty term
		loss = cross_entropy(out,batch_label)
			+ self.gamma * bit_decay
```

.lc[
# Convolution Heuristics
- We tie a quantization function to each kernel see `__init__`
- Calculating Size layer which contributes to the penalty term is proportional to the actual active size of the layer. see `size_layer()`
```py
# a much more accurate size would have been
size_layer = prods* torch.where(self.b>0,1,0)
# but the above only promotes sparsity.
#+ (sum of bit depth) promotes both compression and sparsity
```
- We Quantize the weights of the layer every forward pass. see `__call__`
- Bad training batches can result in "irreversible" forgetting
]

.rcb[
```py
class Qconv(torch.nn.Module):
	"""
	weight tying exp_bits and depth_bits
	note number  of output  channels  is number of filters launched
	"""
	def  __init__ (self,...):
		...
		# 1 for each kernel (out_channel).. 
		self.exp_bit =
				torch.ones(out_channels,1,1,1)*e
		self.depth_bit =
				torch.ones(out_channels,1,1,1)*b
		...

	def size_layer(self):
		prods = torch.as_tensor(self.weight.shape[1:])
		# height * width * sum of depths of filters
		-> size = torch.prod(prods) *
			torch.sum(torch.relu(self.depth_bit))
		return size

	def __call__(self,x):
		# quantize every forward pass
		W = self._quantized_weight()
		return F.conv2d(x,W,padding=self.padding)
```
]

	def __init__(self):
		super().__init__()
		self.conv1 = Qconv(1, 32,b=2)
		self.conv2 = Qconv(32,64,b=2)
		self.bn1 = torch.nn.BatchNorm2d(64)

		self.conv3 = Qconv(64,32,b=1.5,e=-7)
		self.conv4 = Qconv(32,16,b=1.3,e=-6)
		self.bn2 = torch.nn.BatchNorm2d(16)
		
		self.pool = torch.nn.MaxPool2d(2, 2)

		# none of these would be pruned
		#+ kernel trick to avoid mlp head
		self.conv_lin = Qconv(16, 10,

	def forward(self, x):
		...
		pool2 = self.pool(conv4_out)
		# flattening trick with conv
		flat = self.conv_lin(pool2) #B, 10, 1,1
		logits = flat.view(flat.size(0),-1) # B,10

.lc[
# nn.Linear Heuristics
- Our Idea follows L1 feature selection. Prune the associated dual basis if the feature does not influence prediction.
- So we tie a quantization function to each row (`m`) of nn.Linear
- similar to convolution the size layer is proportional to the true size (but not accurate, they cancel out when i divide with total parameters at init).
]

.rcb[
```py
class QlinearMLP(torch.nn.Module):
	"""
	we will only use this to make mlp heads
	"""
	def __init__(self,m,n,...):
		"""
		maps R:m->n
		"""
		...
		self.depth_bit = torch.ones(1,m) * b
		self.exp_bit = torch.ones(1,m) * e

	def size_layer(self):
		return torch.sum(torch.relu(self.depth_bit))
						* self.n

	def __call__(self,x):
		# quantize weight every forward pass
		W = self._quantized_weight()
		return F.linear(x,W,bias=self.linear.bias)
```
]

		self.conv2 = Qconv(16,16,b=2)
		self.conv3 = Qconv(16,32,b=1.5,e=-7)
		self.conv4 = Qconv(32,32,b=1.3,e=-6)
		self.pool = torch.nn.MaxPool2d(2, 2)
		self.bn1 = torch.nn.BatchNorm2d(16)
		self.bn2 = torch.nn.BatchNorm2d(32)

		self.L1 = QlinearMLP(32*7*7, 32)

		self.L2 = QlinearMLP(32, 10)

```py

half-1, x > half-1
-half, x < -half
0, elsewhere
}

1, x > half -1
-1, x< -half
0, elsewhere

		} else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
			direction = 'left';
		}
	});

	// Touch input
	let touchStartX = 0;
	let touchEndX = 0;

	document.addEventListener('touchstart', function (e) {
		touchStartX = e.changedTouches[0].screenX;
	});

	document.addEventListener('touchend', function (e) {
		touchEndX = e.changedTouches[0].screenX;
		handleGesture();
	});

	function handleGesture() {
		const delta = touchEndX - touchStartX;
		if (Math.abs(delta) > 30) { // minimum swipe distance
			if (delta < 0) {
				direction = 'right'; // swipe left = next
			} else {
				direction = 'left';  // swipe right = previous
			}
		}
	}

	slideshow.on('afterShowSlide', function () {
		const slide = document.querySelector('.remark-visible');
		if (!slide) return;

		// Remove both to reset state
		slide.classList.remove('slide-to-next', 'slide-to-prev');

		// Force reflow to flush previous animation
		void slide.offsetWidth;

		// Add animation based on keypress direction
		slide.classList.add(direction === 'right' ? 'slide-to-prev' : 'slide-to-next');
	});
</script>

<script>
var slideElements

function getElementForSlide(slide) {
	slideElements = slideElements || document.querySelectorAll('.remark-slide')
	return slideElements[slide.getSlideIndex()]
}

slideshow.on('showSlide', function (slide) {
	Array.from(getElementForSlide(slide).querySelectorAll('video')).forEach(function (vid) {
		vid.loop = true
		vid.currentTime = 0
		vid.play()
	})
})

slideshow.on('hideSlide', function (slide) {
	Array.from(getElementForSlide(slide).querySelectorAll('video')).forEach(function (vid) {
		vid.pause()
	})
})
</script>
