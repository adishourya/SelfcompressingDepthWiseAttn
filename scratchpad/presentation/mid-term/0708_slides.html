		.slide-to-next {
			animation: slideNext 0.45s cubic-bezier(0.618,-0.6, 0.382,1.618);
		}

		@keyframes slidePrev {
			from { transform: translateY(100%); opacity: 0; }
			to   { transform: translateY(0);    opacity: 1; }
		}

		@keyframes slideNext {
			from { transform: translateY(-100%); opacity: 0; }
			to   { transform: translateY(0);     opacity: 1; }
		}


		.opacityshudder {
			animation: opacityshudder 0.4s linear 0s 2;
		}

		@keyframes .opacityshudder {
			0%   { opacity: 1; }
			20%  { opacity: 0.4; }
			40%  { opacity: 0.8; }
			60%  { opacity: 0.2; }
			80%  { opacity: 0.9; }
			100% { opacity: 1; }
		}

		.huerotate {
			animation: huerotate 6s infinite linear;
		}

		@keyframes huerotate {
			0%   { filter: hue-rotate(0deg); }
			100% { filter: hue-rotate(360deg); }
		}

		.breathe {
			animation: breathe 2.5s cubic-bezier(0.618, 0, 0.382, 1) infinite alternate;

<script>
	let direction = 'right'; // default direction

	document.addEventListener('keydown', function (e) {
		if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
			direction = 'right';
		} else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
			direction = 'left';
		}
	});

	// Touch input
	let touchStartX = 0;
	let touchEndX = 0;

	document.addEventListener('touchstart', function (e) {
		touchStartX = e.changedTouches[0].screenX;
	});

	document.addEventListener('touchend', function (e) {
		touchEndX = e.changedTouches[0].screenX;
		handleGesture();
	});

	function handleGesture() {
		const delta = touchEndX - touchStartX;
		if (Math.abs(delta) > 30) { // minimum swipe distance
			if (delta < 0) {
				direction = 'right'; // swipe left = next
			} else {
				direction = 'left';  // swipe right = previous
			}
		}
	}

	slideshow.on('afterShowSlide', function () {
		const slide = document.querySelector('.remark-visible');
		if (!slide) return;

		// Remove both to reset state
		slide.classList.remove('slide-to-next', 'slide-to-prev');

		// Force reflow to flush previous animation
		void slide.offsetWidth;

		// Add animation based on keypress direction
		slide.classList.add(direction === 'right' ? 'slide-to-prev' : 'slide-to-next');
	});
</script>

<script>
var slideElements;

function getElementForSlide(slide) {
	slideElements = slideElements || document.querySelectorAll('.remark-slide');
	return slideElements[slide.getSlideIndex()];
}

slideshow.on('showSlide', function (slide) {
	const slideEl = getElementForSlide(slide);

	// video handling (optional)
	Array.from(slideEl.querySelectorAll('video')).forEach(function (vid) {
		vid.loop = true;
		vid.currentTime = 0;
		vid.play();
	});

	// mermaid re-init
	const mermaidBlocks = slideEl.querySelectorAll('.mermaid');
	mermaidBlocks.forEach(block => {
		// prevent re-rendering already rendered diagrams
		if (!block.classList.contains('rendered')) {
			// render this block only
			mermaid.init(undefined, block);
			block.classList.add('rendered'); // mark as rendered
		}
	});
});
</script>
